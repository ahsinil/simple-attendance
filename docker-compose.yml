services:
  app:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
      args:
        # VITE_API_URL defaults to /api (same-origin monolith — no change needed)
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: attendance-app
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      - APP_NAME=${APP_NAME:-Attendance System}
      - APP_ENV=production
      - APP_DEBUG=true
      - APP_KEY=${APP_KEY}
      - APP_URL=${APP_URL}
      - APP_TIMEZONE=${APP_TIMEZONE:-UTC}
      - DB_CONNECTION=mysql
      - DB_HOST=${DB_HOST:-host.docker.internal}
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - SESSION_DRIVER=${SESSION_DRIVER:-database}
      - CACHE_STORE=${CACHE_STORE:-database}
      - QUEUE_CONNECTION=${QUEUE_CONNECTION:-database}
      - BARCODE_SECRET_KEY=${BARCODE_SECRET_KEY}
      - BARCODE_ROTATION_SECONDS=${BARCODE_ROTATION_SECONDS:-300}
      - GPS_MAX_ACCURACY_METERS=${GPS_MAX_ACCURACY_METERS:-100}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
    volumes:
      - storage:/var/www/html/storage/app
    networks:
      - attendance-network

  # Optional: Redis for caching/sessions (see DEPLOY.md)
  redis:
    image: redis:7-alpine
    container_name: attendance-redis
    restart: unless-stopped
    networks:
      - attendance-network
    profiles:
      - redis # Only starts when: docker compose --profile redis up

volumes:
  storage:

networks:
  attendance-network:
    driver: bridge
